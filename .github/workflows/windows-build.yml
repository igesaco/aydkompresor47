name: Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ayd/**'
      - 'web/**'
      - 'tests/**'
      - 'desktop.py'
      - 'requirements-desktop.txt'
      - 'scripts/build-windows.ps1'
      - '.github/workflows/windows-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test and package
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-test-logs
          path: build/windows-tests.log
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: AYD-Kompresor-Windows
          path: dist/AYD-Kompresor.exe
          if-no-files-found: error
          retention-days: 30
